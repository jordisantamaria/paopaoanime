name: Sync Anime

on:
  schedule:
    - cron: '0 21 * * 0' # Sundays 21:00 UTC (Monday 06:00 JST)
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run sync-anime
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          # Opcional: sin él, el fallback de AnimeSchedule usa su endpoint
          # público, que funciona pero con rate limiting agresivo.
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
        run: npx tsx scripts/sync-anime.ts

      # Anime pages are fully static and only the slugs known at build time exist
      # (`dynamicParams = false` on /anime/[slug]). Revalidating the cache tag would
      # refresh existing pages but leave anime added by this sync as 404s, so the
      # workflow triggers a production rebuild instead. The new deployment also gets
      # a fresh Data Cache (keyed by VERCEL_DEPLOYMENT_ID in src/lib/data.ts).
      # `always()`, not `!cancelled()`: a partial run still writes to the DB, and
      # GitHub reports the `timeout-minutes` cut as *cancelled* — that is what
      # happened on 2026-09-13, when the run wrote until 4s before dying and the
      # site never picked it up.
      - name: Rebuild site
        if: ${{ always() }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
