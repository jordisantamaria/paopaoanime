name: Sync Anime

on:
  schedule:
    - cron: '0 21 * * 0' # Sundays 21:00 UTC (Monday 06:00 JST)
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run sync-anime
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: npx tsx scripts/sync-anime.ts

      # Las páginas de anime son estáticas puras y no caducan solas (ver
      # ANIME_CACHE_TTL en src/lib/data.ts), así que sin esta llamada la web se
      # quedaría con los datos del último build por mucho que la DB cambie.
      # Es el único momento en que el sitio genera ISR writes.
      - name: Revalidate site cache
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/revalidate"
